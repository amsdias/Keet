name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Fast gate: unit + DSP-chain integration tests (no audio device needed —
  # the chain tests drain the rtrb ring in place of the callback). Platform-
  # agnostic, so one Linux runner is enough.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps
        run: |
          # The runner image ships third-party apt repos (Chrome, Microsoft)
          # that we never use. `apt-get update` exits 100 if ANY index fails,
          # so a hash-sum mismatch mid-publish on Google's CDN fails the whole
          # job — which is exactly what happened. Drop those lists first: the
          # three dev packages below all come from Ubuntu's own repos. Ubuntu's
          # own sources live in sources.list.d too (deb822 on 24.04), so remove
          # the specific vendor files rather than the directory.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          # Still retry: a mirror can be mid-sync for genuinely transient
          # reasons. Fail loudly if all attempts fail — `|| sleep` would leave
          # the loop exiting 0 and hide a real outage behind a later error.
          ok=
          for _ in 1 2 3; do
            if sudo apt-get update; then ok=1; break; fi
            sleep 5
          done
          [ -n "$ok" ] || { echo "apt-get update failed after 3 attempts"; exit 1; }
          sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config

      - name: Test
        run: cargo test --workspace

  # Lint gate. `-D warnings` promotes clippy warnings to errors so the tree
  # stays at zero. Drop the `-- -D warnings` to match CLAUDE.md's "warnings are
  # informational" stance (then only hard clippy errors fail CI).
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux deps
        run: |
          # The runner image ships third-party apt repos (Chrome, Microsoft)
          # that we never use. `apt-get update` exits 100 if ANY index fails,
          # so a hash-sum mismatch mid-publish on Google's CDN fails the whole
          # job — which is exactly what happened. Drop those lists first: the
          # three dev packages below all come from Ubuntu's own repos. Ubuntu's
          # own sources live in sources.list.d too (deb822 on 24.04), so remove
          # the specific vendor files rather than the directory.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          # Still retry: a mirror can be mid-sync for genuinely transient
          # reasons. Fail loudly if all attempts fail — `|| sleep` would leave
          # the loop exiting 0 and hide a real outage behind a later error.
          ok=
          for _ in 1 2 3; do
            if sudo apt-get update; then ok=1; break; fi
            sleep 5
          done
          [ -n "$ok" ] || { echo "apt-get update failed after 3 attempts"; exit 1; }
          sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Don't spend matrix-build minutes if the code is red.
    needs: [test, clippy]

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: keet
            out: keet-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: keet
            out: keet-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: keet
            out: keet-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: keet.exe
            out: keet-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux system dependencies
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          # The runner image ships third-party apt repos (Chrome, Microsoft)
          # that we never use. `apt-get update` exits 100 if ANY index fails,
          # so a hash-sum mismatch mid-publish on Google's CDN fails the whole
          # job — which is exactly what happened. Drop those lists first: the
          # three dev packages below all come from Ubuntu's own repos. Ubuntu's
          # own sources live in sources.list.d too (deb822 on 24.04), so remove
          # the specific vendor files rather than the directory.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          # Still retry: a mirror can be mid-sync for genuinely transient
          # reasons. Fail loudly if all attempts fail — `|| sleep` would leave
          # the loop exiting 0 and hide a real outage behind a later error.
          ok=
          for _ in 1 2 3; do
            if sudo apt-get update; then ok=1; break; fi
            sleep 5
          done
          [ -n "$ok" ] || { echo "apt-get update failed after 3 attempts"; exit 1; }
          sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.out }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
