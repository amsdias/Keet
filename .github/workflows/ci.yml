name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Read-only token: nothing here writes to the repository.
permissions:
  contents: read

# Actions are pinned by commit SHA (a tag can be moved to other code), and
# the Rust version is pinned so a new stable release cannot turn CI red with
# no code change (new lints + `-D warnings`). Bump RUST_VERSION deliberately.
env:
  RUST_VERSION: "1.98.1"

jobs:
  # Fast gate: unit + DSP-chain integration tests (no audio device needed —
  # the chain tests drain the rtrb ring in place of the callback). Platform-
  # agnostic, so one Linux runner is enough.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Linux deps
        uses: ./.github/actions/linux-deps

      - name: Test
        run: cargo test --workspace

  # Lint gate. `-D warnings` promotes clippy warnings to errors so the tree
  # stays at zero. Every OS: platform code (WASAPI exclusive mode and media
  # keys on Windows, CoreAudio on macOS) is compiled out everywhere else, so a
  # Linux-only lint never saw it.
  clippy:
    name: Clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Install Linux deps
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Don't spend matrix-build minutes if the code is red.
    needs: [test, clippy]

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: keet
            out: keet-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: keet
            out: keet-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: keet
            out: keet-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: keet.exe
            out: keet-windows-x86_64.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/linux-deps

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.out }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
