name: Release

on:
  push:
    tags:
      - "v*"

# Read-only by default. Only the publish job, which runs no project code,
# gets write access: building runs every dependency's build script, and none
# of them should hold a token that can rewrite releases.
permissions:
  contents: read

# Pinned like ci.yml: actions by commit SHA, Rust by version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RUST_VERSION: "1.98.1"

jobs:
  # A tag is no reason to ship untested code.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Linux deps
        uses: ./.github/actions/linux-deps

      - name: Test
        run: cargo test --workspace

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: test

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: keet
            out: keet-${{ github.ref_name }}-linux-x86_64
          - os: macos-latest
            target: x86_64-apple-darwin
            bin: keet
            out: keet-${{ github.ref_name }}-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: keet
            out: keet-${{ github.ref_name }}-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: keet.exe
            out: keet-${{ github.ref_name }}-windows-x86_64.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      # Sync Cargo.toml version with the git tag (strip leading 'v')
      - name: Set version from tag (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml

      - name: Set version from tag (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          (Get-Content Cargo.toml) -replace '^version = ".*"', "version = `"$version`"" | Set-Content Cargo.toml

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/linux-deps

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/${{ matrix.bin }} dist/${{ matrix.bin }}

      - name: Compress (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd dist
          tar -czf ${{ matrix.out }}.tar.gz ${{ matrix.bin }}

      - name: Compress (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd dist
          powershell Compress-Archive -Path ${{ matrix.bin }} -DestinationPath ${{ matrix.out }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.out }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  # One job creates the release with every archive. Each matrix job used to
  # create it on its own: four racing creations of the same release.
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
