name: Install Linux build deps
description: ALSA and D-Bus headers for cpal and souvlaki, with a resilient apt update.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # The runner image ships third-party apt repos (Chrome, Microsoft)
        # that we never use. `apt-get update` exits 100 if ANY index fails,
        # so a hash-sum mismatch mid-publish on Google's CDN fails the whole
        # job — which is exactly what happened. Drop those lists first: the
        # three dev packages below all come from Ubuntu's own repos. Ubuntu's
        # own sources live in sources.list.d too (deb822 on 24.04), so remove
        # the specific vendor files rather than the directory.
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                   /etc/apt/sources.list.d/microsoft-prod.list
        # Still retry: a mirror can be mid-sync for genuinely transient
        # reasons. Fail loudly if all attempts fail — `|| sleep` would leave
        # the loop exiting 0 and hide a real outage behind a later error.
        ok=
        for _ in 1 2 3; do
          if sudo apt-get update; then ok=1; break; fi
          sleep 5
        done
        [ -n "$ok" ] || { echo "apt-get update failed after 3 attempts"; exit 1; }
        sudo apt-get install -y libasound2-dev libdbus-1-dev pkg-config
